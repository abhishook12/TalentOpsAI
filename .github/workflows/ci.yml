name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest
        working-directory: ./backend
        run: python -m pytest tests/
      - name: Verify Scout capture fixtures
        run: python -m pytest scout_desktop/tests/test_golden_dataset.py
      - name: Compile backend sources
        working-directory: ./backend
        run: python -m compileall -q app

  frontend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install
      - name: Run Vitest
        working-directory: ./frontend
        run: npm run test -- --passWithNoTests
      - name: Lint and build production frontend
        working-directory: ./frontend
        run: npm run build

  security-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject disabled TLS verification in production services
        run: |
          ! grep -R --include='*.py' 'verify=False' backend/app/services
      - name: Reject known default production credentials
        run: |
          ! grep -R --include='*.py' -E 'ADMIN_PASSWORD.*1012|super-secret-jwt-key' backend/app

  frontend-e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install
      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        working-directory: ./frontend
        run: npx playwright test --pass-with-no-tests
