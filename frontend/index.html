<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport with safe area support -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO Meta -->
    <title>TalentOps Intelligence Platform</title>
    <meta name="description" content="TalentOps is an AI-powered recruiter intelligence platform. Search, enrich, and analyze 400K+ recruiters across companies and industries." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://talentops.ai/" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://talentops.ai/" />
    <meta property="og:title" content="TalentOps – Recruiter Intelligence Platform" />
    <meta property="og:description" content="Search and enrich 400K+ recruiters with AI-powered insights, company signals, and campaign automation." />
    <meta property="og:image" content="/talentops-logo.png" />
    <meta property="og:site_name" content="TalentOps" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TalentOps – Recruiter Intelligence Platform" />
    <meta name="twitter:description" content="Search and enrich 400K+ recruiters with AI-powered insights." />
    <meta name="twitter:image" content="/talentops-logo.png" />

    <!-- Theme / PWA -->
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/talentops-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Font preloads for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Fonts - defer load to not block render -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400..700&family=DM+Sans:opsz,wght@9..40,400..700&family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css" media="print" onload="this.media='all'" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "TalentOps",
      "applicationCategory": "BusinessApplication",
      "description": "AI-powered recruiter intelligence platform with 400K+ recruiter profiles.",
      "url": "https://talentops.ai"
    }
    </script>
  </head>
  <body style="background-color: #000000; color: #ffffff;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
